<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>go-bpm modeler</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar" class="toolbar"></header>
      <div class="workbench">
        <aside class="sidebar">
          <div id="workspace-path" class="workspace-path"></div>
          <ul id="file-list" class="file-list"></ul>
        </aside>
        <div id="sidebar-resizer" class="resizer" title="Перетащите, чтобы изменить ширину; двойной щелчок - по умолчанию"></div>
        <main class="main">
          <nav id="tabs" class="tabs"></nav>
          <div id="editors" class="editors">
            <div id="empty" class="empty">Выберите рабочую папку и откройте файл</div>
          </div>
          <footer id="status" class="status"></footer>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
