# Тесты и сборка под Linux x86-64 и ARM64, Windows, macOS Intel и Apple Silicon. На тег v* - релиз с бинарниками
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WAILS_VERSION: v2.17.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # GTK и WebKitGTK нужны go vet: main импортирует Wails с cgo
      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Зависимости фронтенда
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Тесты
        run: make test

      - name: Линтеры
        run: make lint

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            flags: -tags webkit2_41
          # Нативная сборка на ARM-раннере GitHub (бесплатен для публичных репозиториев)
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            flags: -tags webkit2_41
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
          # Оба варианта macOS собираются на arm64-раннере: clang из Xcode умеет x86_64
          - name: darwin-amd64
            os: macos-latest
            platform: darwin/amd64
          - name: darwin-arm64
            os: macos-latest
            platform: darwin/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Системные пакеты
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Сборка
        shell: bash
        run: wails build -clean -platform ${{ matrix.platform }} ${{ matrix.flags }}

      - name: Архив
        shell: bash
        run: |
          mkdir -p dist
          archive="go-bpm-modeler-${{ matrix.name }}"
          case "${{ runner.os }}" in
            Linux)   tar -czf "dist/$archive.tar.gz" -C build/bin go-bpm-modeler ;;
            Windows) 7z a "dist/$archive.zip" ./build/bin/go-bpm-modeler.exe ;;
            # ditto сохраняет атрибуты и симлинки бандла .app
            macOS)   ditto -c -k --keepParent build/bin/go-bpm-modeler.app "dist/$archive.zip" ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: go-bpm-modeler-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Публикация на https://go-bpm.tech/modeler/: push в main - канал dev, тег v* - релиз (канал latest).
  # Секреты: DEPLOY_HOST, DEPLOY_SSH_KEY (ключ, которому на сервере разрешён только /opt/go-bpm-modeler/publish.sh,
  # копия deploy/publish.sh), DEPLOY_KNOWN_HOSTS
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Публикация
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            args="release $GITHUB_REF_NAME $GITHUB_SHA"
          else
            args="dev ${GITHUB_SHA::7} $GITHUB_SHA"
          fi
          ls -la dist
          tar -cf - -C dist . | ssh -o BatchMode=yes "root@$DEPLOY_HOST" "$args"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
